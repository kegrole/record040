# The fully compliant workload: zero findings expected.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: compliant-app
  namespace: team-a
  labels:
    app: compliant-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: compliant-app
  template:
    metadata:
      labels:
        app: compliant-app
    spec:
      hostNetwork: false
      hostPID: false
      hostIPC: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: registry.example.com/app:1.0
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: APP_CONFIG
              # Literal block scalar: embedded newlines must be preserved.
              value: |
                feature=enabled
                log_level=info
                region=cn-east
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
